<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F2EA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE8DF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="prog" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#0F6E56" />
      <stop offset="50%"  style="stop-color:#D97B52" />
      <stop offset="100%" style="stop-color:#534AB7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)" rx="0"/>

  <!-- Page card -->
  <rect x="60" y="44" width="680" height="332" rx="10" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Top bar dots -->
  <circle cx="96" cy="74" r="5" fill="#E8E2D9"/>
  <circle cx="114" cy="74" r="5" fill="#E8E2D9"/>
  <circle cx="132" cy="74" r="5" fill="#E8E2D9"/>

  <!-- Divider under top bar -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="#F0EBE4" stroke-width="1"/>

  <!-- Icon -->
  <text x="96" y="148" font-family="serif" font-size="36">🗂️</text>

  <!-- Title -->
  <text x="148" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A">Deep Learning Specialization</text>
  <text x="148" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#9B9288">The Big Picture — Andrew Ng · Coursera · 3 of 4 complete</text>

  <!-- Divider -->
  <line x1="96" y1="176" x2="704" y2="176" stroke="#F0EBE4" stroke-width="1"/>

  <!-- Course 1 box -->
  <rect x="96" y="196" width="108" height="50" rx="6" fill="#E1F5EE"/>
  <text x="150" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#0F6E56" text-anchor="middle" letter-spacing="0.05em">COURSE 1</text>
  <text x="150" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#0F6E56" text-anchor="middle">NNs &amp; Deep Learning</text>
  <text x="150" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#0F6E56" text-anchor="middle">✓ Done</text>

  <!-- Arrow 1→2 -->
  <text x="213" y="226" font-family="sans-serif" font-size="14" fill="#C8BFB5" text-anchor="middle">→</text>

  <!-- Course 2 box -->
  <rect x="228" y="196" width="108" height="50" rx="6" fill="#FAECE7"/>
  <text x="282" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#D97B52" text-anchor="middle" letter-spacing="0.05em">COURSE 2</text>
  <text x="282" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#D97B52" text-anchor="middle">Improving DNNs</text>
  <text x="282" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#D97B52" text-anchor="middle">✓ Done</text>

  <!-- Arrow 2→3 -->
  <text x="345" y="226" font-family="sans-serif" font-size="14" fill="#C8BFB5" text-anchor="middle">→</text>

  <!-- Course 3 box -->
  <rect x="360" y="196" width="108" height="50" rx="6" fill="#ECEAFF"/>
  <text x="414" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#534AB7" text-anchor="middle" letter-spacing="0.05em">COURSE 3</text>
  <text x="414" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#534AB7" text-anchor="middle">ML Strategy</text>
  <text x="414" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#534AB7" text-anchor="middle">✓ Done</text>

  <!-- Arrow 3→4 -->
  <text x="477" y="226" font-family="sans-serif" font-size="14" fill="#C8BFB5" text-anchor="middle">→</text>

  <!-- Course 4 box (dimmed) -->
  <rect x="492" y="196" width="108" height="50" rx="6" fill="#FEF3E2" opacity="0.7"/>
  <text x="546" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#854F0B" text-anchor="middle" letter-spacing="0.05em" opacity="0.7">COURSE 4</text>
  <text x="546" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#854F0B" text-anchor="middle" opacity="0.7">CNNs</text>
  <text x="546" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#854F0B" text-anchor="middle" opacity="0.7">→ Next</text>

  <!-- Progress label -->
  <text x="96" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#C8BFB5" letter-spacing="0.06em">PROGRESS</text>

  <!-- Progress track -->
  <rect x="96" y="294" width="260" height="6" rx="3" fill="#E8E5DF"/>
  <!-- Progress fill (75%) -->
  <rect x="96" y="294" width="195" height="6" rx="3" fill="url(#prog)"/>

  <!-- Progress text -->
  <text x="370" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#9B9288">3 of 4 complete · 75%</text>

  <!-- Bottom label -->
  <text x="96" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#C8BFB5">Personal study notes · Notion</text>
</svg>
