# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Yanqi Huang
subtitle: 'Biostatistics | PhD Applicant'
description: 'Personal academic website of Yanqi Huang, biostatistics graduate student and PhD applicant.'
keywords: biostatistics, statistics, PhD, causal inference, survival analysis
author: Yanqi Huang
language: en
timezone: 'America/New_York'

# URL
## GitHub Pages user site (clean URL, no subfolder)
url: https://yqhuang1234-ui.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: blog
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - projects-data.json
  - statistical theory/**
  - files/course2_week1_code/**
  - files/course2/**
  - files/course1/**
  - deep-learning/**

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: fluid

# Deployment
deploy:
  type: git
  repo: https://github.com/yqhuang1234-ui/yqhuang1234-ui.github.io.git
  branch: gh-pages
  message: "Deploy site [ci skip] - {{ now('YYYY-MM-DD HH:mm:ss') }}"
